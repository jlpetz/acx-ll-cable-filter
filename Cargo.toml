# The llcable crates provide the public cable SDK, routing, effects, Windows audio host, control panel API and live mixer.
# The nf crates contain the driver protocol, real-time memory, speech stages, isolated plug-in host and single-chain app.
[workspace]
resolver = "3"
members = [
    "crates/nf-core",
    "crates/nf-mem",
    "crates/nf-stages",
    "crates/nf-ort",
    "crates/nf-engine",
    "crates/nf-gui",
    "crates/nf-app",
    "crates/nf-vmic",
    "crates/nf-fx",
    "crates/llcable-*",
]
default-members = ["crates/nf-app", "crates/llcable-mixer", "crates/llcable-control", "crates/llcable-sdk", "crates/nf-fx"]
# The vendored crate is a patch, not a member: excluded, so cargo runs inside it (its own tests) instead of refusing
# ("believes it's in a workspace").
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# 1.92: ort 2.0.0-rc.15's minimum.
rust-version = "1.92"
publish = false

[workspace.dependencies]
nf-core = { path = "crates/nf-core" }
nf-mem = { path = "crates/nf-mem" }
nf-stages = { path = "crates/nf-stages" }
nf-ort = { path = "crates/nf-ort" }
nf-engine = { path = "crates/nf-engine" }
nf-gui = { path = "crates/nf-gui" }
nf-vmic = { path = "crates/nf-vmic" }
llcable-sdk = { path = "crates/llcable-sdk" }
llcable-control = { path = "crates/llcable-control" }
llcable-routing = { path = "crates/llcable-routing" }
llcable-wasapi = { path = "crates/llcable-wasapi" }
llcable-audio = { path = "crates/llcable-audio" }
llcable-effects = { path = "crates/llcable-effects" }
# Preview or fast-moving crates are pinned exactly (CLAUDE.md, "Real-time rules").
nnnoiseless = { version = "=0.5.2", default-features = false }
# Patched below (vendor/README.md): its per-call FTZ/DAZ is the `denormal-guard` feature, off unless nf-stages'
# `sonora-denormal-guard` is on.
sonora = "=0.3.0"
wasapi = "=0.26.0"
windows-reactor = "=0.100.0"
# ONNX Runtime 1.31.0 (TODO 1, 5). Only nf-ort links it, and nf-engine and nf-app only with their `onnx` feature. No
# ndarray, tracing or copy-dylibs: ort-sys links pyke's static build (which on Windows always includes DirectML, delay-loaded
# by nf-ort's build.rs) and checks the archive's SHA-256 against its own table.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
windows = "0.62.2"
rtrb = "=0.4.1"
rlsf = "=0.2.3"
realfft = "3.5"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# nnnoiseless and sonora must stay real-time in debug builds (a debug nnnoiseless took ~36% of a core).
[profile.dev.package."*"]
opt-level = 3

# sonora 0.3.0 as released, except that its FTZ/DAZ guard (set for each process_* call, sonora #34) is a cargo feature,
# `denormal-guard`, off by default: nf-stages' `sonora-denormal-guard` turns it on (TODO 10). vendor/README.md has the
# diff and how to drop the patch.
[patch.crates-io]
sonora = { path = "vendor/sonora-0.3.0" }
