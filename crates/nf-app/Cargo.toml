[package]
name = "nf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# `cargo run` opens the app, not the console launcher.
default-run = "noise-filter"

[[bin]]
name = "noise-filter"
path = "src/main.rs"

# A console-subsystem launcher for terminals (src/launcher.rs): it runs the sibling noise-filter.exe
# with the same arguments and waits, so the shell waits too and Ctrl+C reaches the command. Copy or
# rename it to `noise-filter.com` next to the exe and a plain `noise-filter` in cmd or PowerShell
# resolves to it (PATHEXT lists .COM before .EXE).
[[bin]]
name = "noise-filter-cli"
path = "src/launcher.rs"

[features]
# Model packs through ONNX Runtime (TODO 5): `--model ulunas` and the like, for evaluation. Off by default, so the default exe
# stays as it was: pyke's ONNX Runtime links DirectML (delay-loaded, build.rs), runs C++ static initialisers before `main`
# (ahead of the CPU gate, which check_cpu_gate_asm.py can't see into), needs AVX2 and adds about 20 MB. The owner builds the
# evaluation variant with `cargo build --release --features onnx`.
onnx = ["nf-engine/onnx", "dep:nf-ort"]

[dependencies]
nf-core.workspace = true
nf-mem.workspace = true
nf-stages.workspace = true
nf-engine.workspace = true
nf-gui.workspace = true
# `bench --model`: the pack's rows and the heap probe (the `onnx` feature only).
nf-ort = { workspace = true, optional = true }
hound.workspace = true
log.workspace = true
# `--config FILE`: the window's settings.json, or a bare EngineConfig.
serde_json.workspace = true
# The console (attach, allocate, Ctrl+C), standard-handle checks, the log's local time, the crash
# message box, the named mutexes (log rotation, one window), the window hand-over, the interactive
# user's account (setup-large-pages) and the launcher's child process.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
