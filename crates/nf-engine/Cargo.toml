[package]
name = "nf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The live probe (src/live_probe.rs): an ignored test that opens real audio devices to trace a device's delivery. Only
# built with this feature, so that no plain `cargo test` can open a device.
live-probe = []
# Model packs through ONNX Runtime (nf-ort, TODO 5): `noise_model` may then name a pack. Off by default: pyke's ONNX Runtime
# links DirectML (delay-loaded, build.rs), runs C++ static initialisers before `main`, needs AVX2 and adds about 20 MB. The
# owner builds the evaluation variant with `--features onnx` (on nf-app, which passes it here).
onnx = ["dep:nf-ort"]

[dependencies]
nf-core.workspace = true
nf-vmic.workspace = true
nf-fx = { path = "../nf-fx" }
nf-mem.workspace = true
nf-stages.workspace = true
nf-ort = { workspace = true, optional = true }
wasapi.workspace = true
rtrb.workspace = true
log.workspace = true
# The flight recorder's dumps (flight.rs): the audio it kept, as 48 kHz mono float WAVs. Its own thread writes them, never the
# audio thread.
hound.workspace = true
# Property store (RAW support) needs the PropertiesSystem, StructuredStorage and Variant features;
# wasapi enables them too, but `cargo check -p nf-engine` compiles with this list alone.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_Performance",
    # The flight recorder's wall clock: the system time, and its local time for the dump's summary.
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }

[dev-dependencies]
# tests/dither_matrix (TODO 10): its JSON lines.
serde_json.workspace = true
