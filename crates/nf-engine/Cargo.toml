[package]
name = "nf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The live probe (src/live_probe.rs): an ignored test that opens real audio devices to trace a device's delivery. Only
# built with this feature, so that no plain `cargo test` can open a device.
live-probe = []

[dependencies]
nf-core.workspace = true
nf-mem.workspace = true
nf-stages.workspace = true
wasapi.workspace = true
rtrb.workspace = true
log.workspace = true
# Property store (RAW support) needs the PropertiesSystem, StructuredStorage and Variant features;
# wasapi enables them too, but `cargo check -p nf-engine` compiles with this list alone.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_Performance",
] }
