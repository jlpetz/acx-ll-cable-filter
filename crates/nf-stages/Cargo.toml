[package]
name = "nf-stages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# sonora's FTZ/DAZ guard (TODO 10): MXCSR's FTZ and DAZ set for the length of each sonora call and restored after it, as sonora
# 0.3.0 ships it. Off by default: the reference and the mic are dithered instead, and Rust calls a changed MXCSR undefined
# behaviour even when restored. The vendored crate (vendor/README.md) builds the guard only with this. nf-app forwards it.
sonora-denormal-guard = ["sonora/denormal-guard"]

[dependencies]
nf-core.workspace = true
nnnoiseless.workspace = true
# RNNoise's spare states, between the audio thread and their maker (rnnoise.rs). Pure Rust, no allocation after construction.
rtrb.workspace = true
sonora.workspace = true
hound.workspace = true
# synth::convolve (test signals only, never on the audio path).
realfft.workspace = true

[dev-dependencies]
# tests/rt_pool.rs: nf-mem's real-time allocator as that test binary's global allocator (RT-1).
nf-mem.workspace = true
