[package]
name = "nf-vmic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The spike's tool (TODO 19, spike check 4): feed, verify, stats, kill-test. `cargo build -p nf-vmic --release`.
[[bin]]
name = "nf-vmic-test"
path = "src/bin/nf-vmic-test.rs"

[dependencies]
# The tool's verify and kill-test record the capture endpoint; the library itself doesn't use it.
wasapi.workspace = true
# The library: Foundation, Security (CreateFileW's and CreateEventW's signatures), Storage_FileSystem (CreateFileW), System_IO
# (DeviceIoControl, OVERLAPPED, CancelIoEx), System_Memory (VirtualAlloc), System_Threading (events). The tool: System_Threading
# (the waitable timer, MMCSS), System_Console (feed's Ctrl+C handler), System_JobObjects (kill-test's job for its children), and
# Media_Audio(_Endpoints), Com, Com_StructuredStorage and Variant for the endpoint volume (IMMDevice::Activate's signature).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
