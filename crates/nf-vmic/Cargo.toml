[package]
name = "nf-vmic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The spike's tool (TODO 19, spike check 4): feed, verify, stats, kill-test, open, latency. `cargo build -p nf-vmic --release`.
[[bin]]
name = "nf-vmic-test"
path = "src/bin/nf-vmic-test.rs"

[dependencies]
# The tool's verify, kill-test, open and latency open the endpoints; the library itself doesn't use it.
wasapi.workspace = true
# The library: Foundation, Security (CreateFileW's and CreateEventW's signatures), Storage_FileSystem (CreateFileW), System_IO
# (DeviceIoControl, OVERLAPPED, CancelIoEx), System_Memory (VirtualAlloc), System_Threading (events). The tool: System_Threading
# (the waitable timer, MMCSS), System_Console (Ctrl+C handlers), System_JobObjects (kill-test's job for its children),
# System_Performance (latency's QPC), and Media_Audio(_Endpoints), Com, Com_StructuredStorage and Variant for the endpoint volume
# (IMMDevice::Activate's signature) and the raw capture and render clients (GetService, CoTaskMemFree).
# The library's variants and sessions (TODO 19): Devices_DeviceAndDriverInstallation (SetupDi, DiInstallDevice, DiUninstallDevice,
# CM_Get_DevNode_Status), Devices_Properties (the driver's INF and version), System_Diagnostics_Debug and System_SystemInformation
# (SetupQueryInfOriginalFileInformationW's and SetupGetInfDriverStoreLocationW's signatures), Media_Audio, Com,
# UI_Shell_PropertiesSystem and Devices_FunctionDiscovery (the endpoints' names and IAudioSessionManager2), System_Threading
# (OpenProcess, QueryFullProcessImageNameW). The switch's lock (variant.rs): System_Threading (the private namespace and its
# mutex), Security (the Administrators SID), Security_Authorization (their security descriptor, from SDDL).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell_PropertiesSystem",
] }
